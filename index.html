<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAR TUNER</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- STYLES -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            CAR<span>TUNER</span>
        </div>

        <div class="current-car">
            <span id="currentCarName">
                Ningún auto seleccionado
            </span>
        </div>

        <div class="top-actions">
            <button id="resetBuild">
                RESET BUILD
            </button>
        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-container">

        <!-- =========================
             LEFT CATEGORY BAR
        ========================== -->

        <aside class="category-bar">

            <button class="category-button active" data-category="car">
                <span>🚗</span>
                <label>CAR</label>
            </button>

            <button class="category-button" data-category="engine">
                <span>⚙</span>
                <label>ENGINE</label>
            </button>

            <button class="category-button" data-category="turbo">
                <span>◆</span>
                <label>TURBO</label>
            </button>

            <button class="category-button" data-category="intake">
                <span>◈</span>
                <label>INTAKE</label>
            </button>

            <button class="category-button" data-category="exhaust">
                <span>≋</span>
                <label>EXHAUST</label>
            </button>

            <button class="category-button" data-category="intercooler">
                <span>▤</span>
                <label>INTERCOOLER</label>
            </button>

            <button class="category-button" data-category="radiator">
                <span>▥</span>
                <label>RADIATOR</label>
            </button>

            <button class="category-button" data-category="clutch">
                <span>◎</span>
                <label>CLUTCH</label>
            </button>

            <button class="category-button" data-category="differential">
                <span>◉</span>
                <label>DIFF</label>
            </button>

            <button class="category-button" data-category="wheels">
                <span>◯</span>
                <label>WHEELS</label>
            </button>

            <button class="category-button" data-category="tires">
                <span>◉</span>
                <label>TIRES</label>
            </button>

            <button class="category-button" data-category="brakes">
                <span>●</span>
                <label>BRAKES</label>
            </button>

            <button class="category-button" data-category="suspension">
                <span>╋</span>
                <label>SUSPENSION</label>
            </button>

            <button class="category-button" data-category="body">
                <span>▱</span>
                <label>BODY KIT</label>
            </button>

            <button class="category-button" data-category="interior">
                <span>▣</span>
                <label>INTERIOR</label>
            </button>

            <button class="category-button" data-category="paint">
                <span>●</span>
                <label>PAINT</label>
            </button>

        </aside>


        <!-- =========================
             3D / CAR AREA
        ========================== -->

        <section class="garage">

            <div class="garage-grid"></div>

            <div id="carViewer">

                <div id="carPlaceholder">

                    <div class="placeholder-icon">
                        🚗
                    </div>

                    <h1>
                        SELECT A CAR
                    </h1>

                    <p>
                        Choose a vehicle from the CAR category.
                    </p>

                </div>

            </div>


            <!-- =========================
                 CAR INFO
            ========================== -->

            <div class="car-info">

                <div class="info-title">
                    VEHICLE DATA
                </div>

                <div class="stats">

                    <div class="stat">
                        <span>POWER</span>

                        <strong>
                            <span id="powerValue">0</span> HP
                        </strong>
                    </div>

                    <div class="stat">
                        <span>TORQUE</span>

                        <strong>
                            <span id="torqueValue">0</span> Nm
                        </strong>
                    </div>

                    <div class="stat">
                        <span>WEIGHT</span>

                        <strong>
                            <span id="weightValue">0</span> kg
                        </strong>
                    </div>

                    <div class="stat">
                        <span>DRIVETRAIN</span>

                        <strong id="drivetrainValue">
                            ---
                        </strong>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         BOTTOM MODIFIER PANEL
    ========================== -->

    <section class="bottom-panel">

        <div class="panel-header">

            <div>

                <span
                    class="panel-category"
                    id="panelCategory"
                >
                    CAR
                </span>

                <span
                    class="panel-subtitle"
                    id="panelSubtitle"
                >
                    SELECT MANUFACTURER
                </span>

            </div>

            <button
                id="backToBrands"
                class="back-button hidden"
            >
                ← BRANDS
            </button>

        </div>


        <!-- =========================
             BRANDS
        ========================== -->

        <div
            id="brandContainer"
            class="horizontal-list"
        ></div>


        <!-- =========================
             PRODUCTS
        ========================== -->

        <div
            id="productContainer"
            class="horizontal-list hidden"
        ></div>

    </section>


    <!-- =========================
         NOTIFICATION
    ========================== -->

    <div
        id="notification"
        class="notification"
    >

        <span id="notificationText"></span>

    </div>


    <!-- =========================
         DATA
    ========================== -->

    <script src="cars.js"></script>
    <script src="parts.js"></script>

    <!-- =========================
         MAIN APP
    ========================== -->

    <script src="app.js"></script>

</body>
</html>
